name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Check package size
        run: |
          echo "Core package size:"
          du -sh packages/core/dist/
          echo "CLI package size:"
          du -sh packages/cli/dist/

      - name: Verify no workspace references in packed tarballs
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ] && node -e "process.exit(require('./$pkg/package.json').private ? 1 : 0)" 2>/dev/null; then
              echo "Packing $pkg..."
              cd "$pkg"
              tarball=$(pnpm pack 2>/dev/null)
              if tar -xzf "$tarball" --to-stdout package/package.json | grep -q '"workspace:'; then
                echo "ERROR: $pkg tarball contains unresolved workspace: references!"
                tar -xzf "$tarball" --to-stdout package/package.json | grep 'workspace:'
                exit 1
              fi
              rm -f "$tarball"
              cd "$GITHUB_WORKSPACE"
              echo "  OK: $pkg clean"
            fi
          done
          echo "All packages verified."
