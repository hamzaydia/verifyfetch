[package]
name = "verifyfetch-hasher"
version = "0.1.0"
authors = ["VerifyFetch Contributors"]
edition = "2021"
license = "Apache-2.0"
description = "Streaming SHA-256/384/512 hasher for VerifyFetch"
repository = "https://github.com/hamzaydia/verifyfetch"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
# For better panic messages in WASM
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization at cost of compile time
