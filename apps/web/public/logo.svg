<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Code brackets + checkmark: "Verified Code" -->

  <!-- Subtle rounded square background for presence -->
  <rect x="6" y="6" width="108" height="108" rx="20" fill="#0d1117" fill-opacity="0.05"/>

  <!-- Left bracket < -->
  <path
    d="M35 28 L18 60 L35 92"
    stroke="#10b981"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Right bracket > -->
  <path
    d="M85 28 L102 60 L85 92"
    stroke="#10b981"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Checkmark in center (the verification) -->
  <path
    d="M44 60 L54 72 L76 47"
    stroke="#10b981"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
